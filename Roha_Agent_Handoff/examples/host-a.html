<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roha fixture A - registration</title></head><body>
<main id="main"><h1>Join a course</h1><p>Plain HTML test fixture. No Roha SDK or discovery is implemented in this file.</p>
<form aria-labelledby="registration-title"><h2 id="registration-title">Learner registration</h2>
<p><label for="preferred-name">What should we call you?</label><input id="preferred-name" name="preferred_name" autocomplete="name" required></p>
<p><label for="id-route">Which identity route works for you?</label><select id="id-route" name="id_route" required><option value="">Choose</option><option value="national">National ID</option><option value="refugee">Refugee ID</option><option value="other">Another document</option><option value="refer">Refer me through a partner</option></select></p>
<p><label for="support">What would make learning easier?</label><textarea id="support" name="support" data-roha-private="true"></textarea></p>
<p>No form submission control is connected. This is a discovery fixture, not a real registration service.</p></form></main></body></html>
