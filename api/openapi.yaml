openapi: 3.1.0
info:
  title: OpenPath forms API
  version: 1.3.0
  summary: Accessible onboarding forms for Savanna — submit, retrieve, and fetch the form definition.
  description: |
    Level 2 of the Digital Bridge adoptability ladder: a documented REST API in front of the
    same JSON schemas the accessible form renders from.

    Forms work without AI. Optional AI settings require administrator authentication.
    Assistant and administrator endpoints are documented below.

    ### Privacy contract
    Accommodation and disability data (the `support` step, anything marked `localOnly`) is
    **never accepted**. If a client sends it anyway the API drops it, never writes it to disk,
    and reports the field names back in `stripped` — so "support answers never leave the phone"
    is a verifiable claim, not a promise.

    ### Storage
    Development uses append-only JSONL; production uses PostgreSQL. With `DATA_KEY`, answers the schema classifies as
    `pii: personal` or `sensitive` (names, phone numbers, ID numbers) are encrypted with
    AES-256-GCM before they are written. Production retrieval returns receipt metadata only. Development retrieval exposes answers to a caller holding the unguessable id
    (`sub_` + 12 random bytes). There is no list endpoint, by design.
  contact:
    name: OpenPath — Digital Bridge Accessibility Hackathon 2026
  license:
    name: MIT
servers:
  - url: /api
    description: Same origin as the form (nginx proxies /api to the container)
  - url: http://localhost:8080/api
    description: Local `docker compose up`
tags:
  - name: meta
  - name: forms
  - name: submissions
paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness and a little about the deployment
      responses:
        '200':
          description: Running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                ok: true
                version: 1.1.0
                forms: [savanna-onboard-v1, savanna-job-v1, employer-accommodations-v1]
                submissions: 128
                uptimeSec: 3600

  /forms:
    get:
      tags: [forms]
      operationId: listForms
      summary: The forms this deployment can accept
      responses:
        '200':
          description: Form summaries. Fetch one by id for the full definition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  forms:
                    type: array
                    items: { $ref: '#/components/schemas/FormSummary' }
                    required: [forms]

  /forms/{formId}:
    get:
      tags: [forms]
      operationId: getForm
      summary: One form definition, exactly as the renderer consumes it
      description: |
        This is what makes "bring your own schema" true: point the renderer at any form the
        API serves. Adding a fourth form is a JSON file in `schema/`, not a code change.
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string }
          examples:
            learner: { value: savanna-onboard-v1 }
            job: { value: savanna-job-v1 }
            employer: { value: employer-accommodations-v1 }
      responses:
        '200':
          description: The schema document (steps, validation rules, Amharic and English strings).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions:
    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Submit a completed form
      description: |
        The server re-validates every answer against the form's own `validation` rules. A client
        that skips validation, or lies, gets `422` with the same rule names the form uses
        (`required`, `phone-et`, `exclusiveOption`, …), so the UI can reuse its messages.

        Rate limited to 30 requests per minute per IP; over the limit returns `429`.
        Bodies over 32 KB return `413`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionRequest' }
            examples:
              learner:
                summary: Learner sign-up, Amharic UI, one support answer that must be dropped
                value:
                  formId: savanna-onboard-v1
                  answers:
                    language: am
                    accessibility-prefs: [large-text]
                    assistance: call-me
                    name: ሳራ ተስፋዬ
                    phone: '0912345678'
                    id-route: fayda
                    id-value: '3910028475'
                    consent: [agree]
      responses:
        '201':
          description: Stored. The id is the only way to read it back — keep it.
          headers:
            Location:
              description: Canonical URL of the created submission.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionReceipt' }
              example:
                id: sub_9mQ2xT7bK1vR4pLz
                receivedAt: '2026-11-15T09:41:02.114Z'
                stripped: [accessibility-prefs]
        '200':
          description: |
            Already stored — this `formId` and `clientRef` pair was seen before. Nothing new was written and the
            body is the original receipt, so a retry can never register the same person twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionReceipt' }
              example:
                id: sub_9mQ2xT7bK1vR4pLz
                receivedAt: '2026-11-15T09:41:02.114Z'
                stripped: [accessibility-prefs]
                duplicate: true
        '413':
          description: Body too large.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Content-Type is not application/json.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validation failed. `fields[]` names each field and the rule it broke.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                error:
                  code: invalid
                  message: Some answers need fixing.
                  fields:
                    - { field: phone, rule: phone-et }
                    - { field: name, rule: required }
        '429':
          description: Rate limited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /submissions/{id}:
    get:
      tags: [submissions]
      operationId: getSubmission
      summary: Read back one submission
      description: |
        In development, anyone holding the id can read the record. Production returns only
        id, receivedAt and formId. Treat the id as a bearer token. There is
        no list endpoint and no search: an attacker cannot enumerate what they do not have.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^sub_[A-Za-z0-9_-]{16}$' }
          example: sub_9mQ2xT7bK1vR4pLz
      responses:
        '200':
          description: The stored submission in development; receipt metadata only in production.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404':
          $ref: '#/components/responses/NotFound'

  /openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenApiDocument
      summary: This document
      responses:
        '200':
          description: OpenAPI 3.1 description of this API.
          content:
            application/yaml:
              schema: { type: string }

  /assistant/config:
    get:
      summary: Selected provider and model, without credentials
      responses:
        '200':
          description: Provider, model, revision and consentRequired. No keys or private endpoints.
  /assistant/interpret:
    post:
      summary: Interpret an explicitly consented typed request
      description: >
        Requires an approved Origin. Input includes consent=true, configRevision, utterance
        (1–1000 characters), and map with mapId, mapVersion and at most 100 resources.
        Resources carry id, privacy and allowedIntents. Only page-metadata IDs/actions
        are forwarded; labels and field values are discarded. No fill/submit action is allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent, configRevision, utterance, map]
              properties:
                consent: { type: boolean, const: true }
                configRevision: { type: integer, minimum: 0 }
                utterance: { type: string, minLength: 1, maxLength: 1000 }
                map: { type: object }
      responses:
        '200': { description: Validated version-2 intent under the intent property. }
        '403': { description: Consent missing or origin not approved. }
        '409': { description: Provider configuration changed; review settings and consent again. }
        '413': { description: Request exceeds 32 KiB. }
        '422': { description: Invalid request or target map. }
        '429': { description: Installation budget or worker concurrency limit reached. }
        '502': { description: Provider unavailable or invalid proposal. }
        '503': { description: AI disabled, administrator not configured, or storage unavailable. }
  /admin/session:
    post:
      summary: Exchange the bootstrap administrator token for a one-hour session
      description: Requires the exact administrator Origin and Authorization Bearer token. Rate limited.
      security: [{ AdminBootstrap: [] }]
      responses:
        '200': { description: HttpOnly SameSite=Strict cookie; Secure over HTTPS. }
        '401': { description: Invalid token. }
        '403': { description: Origin not allowed. }
        '429': { description: Too many login attempts. }
    delete:
      summary: Revoke the current session across workers
      security: [{ AdminSession: [] }]
      responses:
        '200': { description: Revoked and cookie cleared. }
        '401': { description: Sign in required. }
  /admin/config:
    get:
      summary: Read redacted administrator settings
      security: [{ AdminSession: [] }]
      responses:
        '200': { description: provider, model, endpoint, hasKey, revision and requestsPerDay. }
        '401': { description: Sign in required. }
    put:
      summary: Save encrypted provider settings with optimistic revision checking
      description: >
        Requires the administrator Origin. Providers are disabled, openai, gemini,
        anthropic, ollama and custom. API key remains server-side. Custom/Ollama
        destinations must exactly match the operator allowlist.
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIConfigInput' }
      responses:
        '200': { description: Updated redacted configuration. }
        '401': { description: Sign in required. }
        '409': { description: Revision conflict; reload before saving. }
        '422': { description: Invalid configuration or unapproved endpoint. }
  /admin/test:
    post:
      summary: Test unsaved provider settings using a synthetic prompt
      description: May incur provider charges. Does not save settings or send learner data. Requires administrator Origin.
      security: [{ AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIConfigInput' }
      responses:
        '200': { description: Valid safe proposal received. }
        '401': { description: Sign in required. }
        '422': { description: Invalid configuration. }
        '429': { description: Test budget or concurrency exceeded. }
        '502': { description: Provider failed or returned an invalid proposal. }
  /admin/metrics:
    get:
      summary: Per-worker AI counters without utterances or personal data
      security: [{ AdminSession: [] }]
      responses:
        '200': { description: requests, failures, rejected and active counters. }
        '401': { description: Sign in required. }

components:
  securitySchemes:
    AdminBootstrap: { type: http, scheme: bearer }
    AdminSession: { type: apiKey, in: cookie, name: roha_admin }
  schemas:
    AIConfigInput:
      type: object
      required: [provider, revision]
      properties:
        provider: { type: string, enum: [disabled, openai, gemini, anthropic, ollama, custom] }
        model: { type: string, maxLength: 160 }
        endpoint: { type: string }
        apiKey: { type: string, maxLength: 4096, writeOnly: true }
        clearKey: { type: boolean }
        revision: { type: integer, minimum: 0 }
        requestsPerDay: { type: integer, minimum: 1, maximum: 100000 }
    Health:
      type: object
      required: [ok, version, forms, submissions]
      properties:
        ok: { type: boolean }
        version: { type: string }
        forms:
          type: array
          items: { type: string }
        submissions: { type: integer, minimum: 0 }
        uptimeSec: { type: integer, minimum: 0 }

    FormSummary:
      type: object
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: string }
        kind: { type: string, examples: [onboarding] }
        title:
          type: object
          additionalProperties: { type: string }
          description: Localised titles keyed by BCP-47 language tag.
        langs:
          type: array
          items: { type: string }

    SubmissionRequest:
      type: object
      required: [formId, answers]
      additionalProperties: false
      properties:
        clientRef:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
          description: |
            An idempotency key the client generates once and keeps until the sign-up is
            confirmed. Sending the same `clientRef` again returns the **same** record with
            `200` instead of creating a second one — which is what makes it safe to retry
            after a dropped connection, or to flush an offline queue twice.
          examples: [ref_m8x2kq9w4t]
        formId:
          type: string
          description: An id from `GET /forms`.
          examples: [savanna-onboard-v1]
        answers:
          type: object
          description: |
            Step id → answer, exactly as the form collects it. Values are strings, or arrays of
            strings for checkbox steps. Fields marked `localOnly` in the schema are rejected
            and reported in `stripped`.
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: { type: string }

    SubmissionReceipt:
      type: object
      required: [id, receivedAt, stripped]
      properties:
        id:
          type: string
          pattern: '^sub_[A-Za-z0-9_-]{16}$'
        receivedAt: { type: string, format: date-time }
        stripped:
          type: array
          description: Field names that arrived but were deliberately not stored (support, accommodations).
          items: { type: string }
        duplicate:
          type: boolean
          description: Present and `true` only on the `200` replay of an already-stored `clientRef`.

    Submission:
      type: object
      required: [id, receivedAt, formId, answers]
      properties:
        id: { type: string }
        receivedAt: { type: string, format: date-time }
        formId: { type: string }
        answers:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [not-found, rate-limited, bad-json, too-large, unsupported-media-type]
            message: { type: string }

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, fields]
          properties:
            code: { type: string, const: invalid }
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                required: [field, rule]
                properties:
                  field: { type: string }
                  rule:
                    type: string
                    examples: [required, phone-et, email, exclusiveOption, unknown-form, unknown-field, not-an-option]

  responses:
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: not-found, message: No submission with that id. }
