# Static hosting for the three form pages: /onboard, /job, /employer.
# The only thing that must not be removed is the try_files line — without it a hard
# refresh on /job is a 404 because there is no /job file on disk.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml;
    # woff2 is already compressed — re-gzipping fonts wastes CPU and saves nothing

    # ---- security headers (15 points of the rubric are quality, security, privacy) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # voice input needs the microphone; nothing else needs a sensor
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors *; base-uri 'none'; object-src 'none'" always;
    # frame-ancestors is * on purpose: this is meant to be embedded in Savanna (Level 1 of
    # the adoptability ladder). Do not switch to X-Frame-Options: DENY or the widget dies.
    # Everything is same-origin, so no CORS headers are needed.

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # hashed filenames — safe to cache forever
    # ---- the API (Level 2). Same origin, so the page's CSP needs no exception ----
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 2m;       # allows audio up to MAX_AUDIO (2MB); submissions capped at 32k in server.mjs
        # add_header inside a location replaces the inherited set, so repeat the one that matters
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
    }
    location /fonts/ {
        expires 30d;
    }

    # the HTML shell must never be cached, or a deploy leaves people on the old bundle
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
