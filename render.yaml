services:
  - type: web
    name: openpath-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "1"
